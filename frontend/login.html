<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Niva Aura Resin Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <div class="login-box">
        <img src="images/logo.png" alt="Niva Aura Logo" class="signup-logo">
        <h1>Niva Aura Studio</h1>
        <h2>Customer Portal Login</h2>

        <form onsubmit="handleUserLogin(event)">
            <input type="email" id="email" placeholder="Enter Email Address" required autocomplete="email">
            <input type="password" id="password" placeholder="Enter Account Password" required autocomplete="current-password">

            <div style="text-align: left; margin: 12px 0; font-size: 13px; color: #64748B;">
                <label style="cursor: pointer;">
                    <input type="checkbox" onclick="togglePassword()" style="width: auto; margin: 0 6px 0 0;"> Show Password
                </label>
            </div>

            <button type="submit">
                Login To Account 🔐
            </button>
        </form>

        <div style="margin-top: 20px; font-size: 13px;">
            <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <p class="login-text">
            Don't have an account? <a href="singup.html">Sign Up Here</a>
        </p>

        <div style="margin-top: 16px;">
            <a href="index.html" style="font-size: 13px; color: var(--text-muted);">← Return To Main Website</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            let pass = document.getElementById("password");
            if (pass.type === "password") {
                pass.type = "text";
            } else {
                pass.type = "password";
            }
        }

        async function handleUserLogin(event) {
            event.preventDefault();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();

            try {
                const response = await fetch("http://localhost:5000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("name", data.name || email.split("@")[0]);
                    localStorage.setItem("email", email);
                    localStorage.setItem("userLoggedIn", "true");

                    alert("Login Successful! Welcome back.");
                    window.location.href = "account.html";
                    return;
                } else {
                    alert(data.message || "Invalid Email or Password");
                }
            } catch (error) {
                // Fallback login for demo
                localStorage.setItem("name", email.split("@")[0]);
                localStorage.setItem("email", email);
                localStorage.setItem("token", "demo_user_token");
                localStorage.setItem("userLoggedIn", "true");

                alert("Logged in (Demo Session)");
                window.location.href = "account.html";
            }
        }
    </script>
</body>

</html>
