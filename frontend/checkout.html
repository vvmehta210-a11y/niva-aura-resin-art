<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout – Niva Aura Resin Art</title>
    <meta name="description" content="Secure checkout for Niva Aura Resin Art – Enter delivery address to complete your order.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold:      #D4AF37;
            --gold-lt:   #F4E8C1;
            --teal:      #0A3C4A;
            --teal-dk:   #062630;
            --rose:      #E84A5F;
            --orange:    #FF8C42;
            --bg:        #F6F8FA;
            --white:     #FFFFFF;
            --border:    #E2E8F0;
            --muted:     #6B7280;
            --shadow:    0 4px 24px rgba(0,0,0,.08);
            --radius:    16px;
            --transition:0.25s ease;
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body {
            font-family:'Plus Jakarta Sans', sans-serif;
            background:var(--bg);
            color:#1A202C;
            min-height:100vh;
        }

        /* ──────── TOPBAR ──────── */
        .co-topbar {
            background:var(--white);
            padding:14px 28px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            box-shadow:0 2px 12px rgba(0,0,0,.06);
            position:sticky;
            top:0;
            z-index:100;
        }
        .co-brand {
            display:flex;
            align-items:center;
            gap:12px;
            text-decoration:none;
        }
        .co-brand img {
            width:42px; height:42px;
            border-radius:50%;
            object-fit:cover;
            border:2px solid var(--gold);
        }
        .co-brand-text h2 {
            font-size:18px; font-weight:800;
            color:var(--teal); line-height:1;
        }
        .co-brand-text span {
            font-size:9px; letter-spacing:2px;
            color:var(--gold); font-weight:700;
            text-transform:uppercase;
        }
        .co-secure {
            display:flex; align-items:center; gap:6px;
            font-size:12px; font-weight:700;
            color:#15803D; background:#DCFCE7;
            padding:6px 14px; border-radius:20px;
        }

        /* ──────── STEPS ──────── */
        .co-steps {
            background:var(--white);
            border-bottom:1px solid var(--border);
            padding:14px 28px;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:0;
        }
        .co-step {
            display:flex; align-items:center; gap:8px;
            font-size:12px; font-weight:600;
        }
        .co-step-num {
            width:28px; height:28px;
            border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:12px; font-weight:800;
            background:#E2E8F0; color:var(--muted);
            transition:var(--transition);
        }
        .co-step.active .co-step-num { background:var(--teal); color:white; }
        .co-step.done .co-step-num   { background:#15803D; color:white; }
        .co-step-label { color:var(--muted); }
        .co-step.active .co-step-label { color:var(--teal); font-weight:700; }
        .co-step.done .co-step-label   { color:#15803D; font-weight:700; }
        .co-step-line {
            width:48px; height:2px;
            background:#E2E8F0; margin:0 8px;
        }
        .co-step-line.done { background:#15803D; }
        @media(max-width:480px){
            .co-step-line { width:24px; margin:0 4px; }
            .co-step-label { display:none; }
        }

        /* ──────── PAGE LAYOUT ──────── */
        .co-page {
            max-width:1100px;
            margin:32px auto 120px;
            padding:0 20px;
            display:grid;
            grid-template-columns:1fr 360px;
            gap:28px;
        }
        @media(max-width:840px){
            .co-page { grid-template-columns:1fr; margin-bottom:160px; }
        }

        /* ──────── CARD ──────── */
        .co-card {
            background:var(--white);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:28px;
            border:1px solid var(--border);
        }
        .co-card-title {
            font-size:18px; font-weight:800;
            color:var(--teal);
            margin-bottom:22px;
            display:flex; align-items:center; gap:10px;
        }

        /* ──────── SECTION LABEL ──────── */
        .co-section-label {
            font-size:11px; font-weight:700;
            color:var(--gold); letter-spacing:1.5px;
            text-transform:uppercase;
            margin:20px 0 14px;
            display:flex; align-items:center; gap:10px;
        }
        .co-section-label::after {
            content:''; flex:1; height:1px; background:var(--border);
        }

        /* ──────── FORM ──────── */
        .co-form-row {
            display:grid; grid-template-columns:1fr 1fr; gap:14px;
        }
        @media(max-width:500px){ .co-form-row { grid-template-columns:1fr; } }
        .co-form-group { margin-bottom:14px; }
        .co-form-group.full { grid-column:1/-1; }
        .co-form-group label {
            display:block;
            font-size:12px; font-weight:700;
            color:#374151; margin-bottom:6px;
            letter-spacing:.3px;
        }
        .co-form-group input,
        .co-form-group textarea,
        .co-form-group select {
            width:100%; padding:12px 16px;
            border:1.5px solid var(--border);
            border-radius:10px;
            font-size:14px;
            font-family:'Plus Jakarta Sans', sans-serif;
            color:#1A202C;
            background:#FAFBFC;
            outline:none;
            transition:var(--transition);
        }
        .co-form-group input:focus,
        .co-form-group textarea:focus,
        .co-form-group select:focus {
            border-color:var(--teal);
            background:white;
            box-shadow:0 0 0 3px rgba(10,60,74,.12);
        }
        .co-form-group textarea { resize:vertical; min-height:80px; }
        .co-form-group input::placeholder,
        .co-form-group textarea::placeholder { color:#CBD5E1; }

        /* ──────── SUBMIT BUTTON ──────── */
        .co-submit-btn {
            width:100%; padding:15px;
            background:linear-gradient(135deg, var(--teal), #155E75);
            color:white; border:none; border-radius:12px;
            font-size:16px; font-weight:800;
            font-family:'Plus Jakarta Sans', sans-serif;
            cursor:pointer; margin-top:8px;
            display:flex; align-items:center;
            justify-content:center; gap:10px;
            transition:var(--transition);
            box-shadow:0 4px 16px rgba(10,60,74,.25);
        }
        .co-submit-btn:hover {
            transform:translateY(-2px);
            box-shadow:0 8px 24px rgba(10,60,74,.4);
            background:linear-gradient(135deg, var(--gold), #B59021);
            color:#111;
        }
        .co-back-link {
            display:inline-flex; align-items:center; gap:6px;
            font-size:13px; color:var(--muted);
            text-decoration:none; margin-top:14px;
            transition:var(--transition);
        }
        .co-back-link:hover { color:var(--teal); }

        /* ──────── RIGHT: ORDER SUMMARY ──────── */
        .co-summary { position:sticky; top:120px; }
        .co-summary-title {
            font-size:16px; font-weight:800;
            color:var(--teal); margin-bottom:18px;
            display:flex; align-items:center; gap:8px;
        }
        .co-items-list { max-height:260px; overflow-y:auto; }
        .co-item {
            display:flex; gap:12px; align-items:flex-start;
            padding:12px 0; border-bottom:1px solid #F1F5F9;
        }
        .co-item:last-child { border-bottom:none; }
        .co-item-img {
            width:60px; height:60px;
            border-radius:10px; object-fit:cover;
            background:#F1F5F9;
            flex-shrink:0;
        }
        .co-item-info { flex:1; }
        .co-item-name {
            font-size:13px; font-weight:700;
            color:#1A202C; line-height:1.3;
        }
        .co-item-qty {
            font-size:11px; color:var(--muted);
            margin-top:2px;
        }
        .co-item-price {
            font-size:14px; font-weight:800;
            color:var(--teal);
            white-space:nowrap;
        }
        .co-divider { border:none; border-top:1px solid #F1F5F9; margin:14px 0; }

        .co-price-row {
            display:flex; justify-content:space-between;
            font-size:13px; color:var(--muted);
            margin-bottom:8px;
        }
        .co-price-row.total {
            font-size:16px; font-weight:800; color:var(--teal);
            border-top:2px solid var(--border);
            padding-top:12px; margin-top:4px;
        }
        .co-price-row .green { color:#15803D; font-weight:700; }

        .co-trust {
            display:flex; flex-wrap:wrap; gap:8px;
            margin-top:16px;
        }
        .co-badge {
            display:flex; align-items:center; gap:5px;
            font-size:11px; color:#374151;
            background:#F8FAFC; border:1px solid var(--border);
            border-radius:20px; padding:5px 12px;
        }

        /* ──────── EMPTY STATE ──────── */
        .co-empty {
            text-align:center; padding:40px 20px;
        }
        .co-empty h3 { color:var(--teal); margin-bottom:8px; }
        .co-empty p  { color:var(--muted); font-size:13px; margin-bottom:16px; }
        .co-empty a  {
            background:linear-gradient(135deg, var(--gold), #B59021);
            color:#111; font-weight:700; padding:12px 28px;
            border-radius:25px; text-decoration:none;
            font-size:14px; display:inline-block;
        }

        /* ──────── MOBILE STICKY BOTTOM ──────── */
        .co-mobile-bar {
            display:none;
            position:fixed; bottom:0; left:0; right:0;
            background:white; padding:14px 20px;
            box-shadow:0 -4px 20px rgba(0,0,0,.1);
            z-index:200;
            flex-direction:column; gap:4px;
        }
        @media(max-width:840px){ .co-mobile-bar { display:flex; } }
        .co-mobile-total {
            display:flex; justify-content:space-between;
            align-items:center; font-size:13px;
        }
        .co-mobile-total span:first-child { color:var(--muted); }
        .co-mobile-total span:last-child  { font-size:18px; font-weight:800; color:var(--teal); }
        .co-mobile-btn {
            width:100%; padding:14px;
            background:linear-gradient(135deg, var(--teal), #155E75);
            color:white; border:none; border-radius:12px;
            font-size:15px; font-weight:800;
            font-family:'Plus Jakarta Sans', sans-serif;
            cursor:pointer; margin-top:6px;
        }
    </style>
</head>
<body>

<!-- TOPBAR -->
<header class="co-topbar">
    <a href="index.html" class="co-brand">
        <img src="images/logo.png" alt="Niva Aura Logo">
        <div class="co-brand-text">
            <h2>Niva Aura</h2>
            <span>Resin Studio</span>
        </div>
    </a>
    <div class="co-secure">🔒 100% Secure</div>
</header>

<!-- STEP INDICATOR -->
<div class="co-steps">
    <div class="co-step active" id="step-1">
        <div class="co-step-num">1</div>
        <span class="co-step-label">Address</span>
    </div>
    <div class="co-step-line"></div>
    <div class="co-step" id="step-2">
        <div class="co-step-num">2</div>
        <span class="co-step-label">Order Summary</span>
    </div>
    <div class="co-step-line"></div>
    <div class="co-step" id="step-3">
        <div class="co-step-num">3</div>
        <span class="co-step-label">Payment</span>
    </div>
</div>

<div class="co-page">

    <!-- LEFT: ADDRESS FORM -->
    <div>
        <div class="co-card">
            <div class="co-card-title">📦 Delivery Address</div>

            <form id="checkoutForm" onsubmit="saveAddressAndContinue(event)">

                <div class="co-section-label">Contact Information</div>
                <div class="co-form-row">
                    <div class="co-form-group">
                        <label>Full Name *</label>
                        <input type="text" id="customerName" placeholder="e.g. Priya Sharma" required>
                    </div>
                    <div class="co-form-group">
                        <label>Mobile Number *</label>
                        <input type="tel" id="mobile" placeholder="+91 98765 43210"
                               pattern="[0-9+\s\-]{10,15}" required>
                    </div>
                </div>
                <div class="co-form-group">
                    <label>Email Address *</label>
                    <input type="email" id="emailField" placeholder="priya@email.com" required>
                </div>

                <div class="co-section-label">Delivery Address</div>

                <div class="co-form-group">
                    <label>House / Flat / Block No. *</label>
                    <input type="text" id="houseNo" placeholder="e.g. B-204, Sunrise Apartments" required>
                </div>
                <div class="co-form-group">
                    <label>Street / Area / Locality *</label>
                    <textarea id="address" placeholder="e.g. Near City Mall, MG Road" required></textarea>
                </div>
                <div class="co-form-row">
                    <div class="co-form-group">
                        <label>City *</label>
                        <input type="text" id="city" placeholder="Ahmedabad" required>
                    </div>
                    <div class="co-form-group">
                        <label>State *</label>
                        <select id="state" required>
                            <option value="">Select State</option>
                            <option>Andhra Pradesh</option>
                            <option>Arunachal Pradesh</option>
                            <option>Assam</option>
                            <option>Bihar</option>
                            <option>Chhattisgarh</option>
                            <option>Goa</option>
                            <option>Gujarat</option>
                            <option>Haryana</option>
                            <option>Himachal Pradesh</option>
                            <option>Jharkhand</option>
                            <option>Karnataka</option>
                            <option>Kerala</option>
                            <option>Madhya Pradesh</option>
                            <option>Maharashtra</option>
                            <option>Manipur</option>
                            <option>Meghalaya</option>
                            <option>Mizoram</option>
                            <option>Nagaland</option>
                            <option>Odisha</option>
                            <option>Punjab</option>
                            <option>Rajasthan</option>
                            <option>Sikkim</option>
                            <option>Tamil Nadu</option>
                            <option>Telangana</option>
                            <option>Tripura</option>
                            <option>Uttar Pradesh</option>
                            <option>Uttarakhand</option>
                            <option>West Bengal</option>
                            <option>Delhi</option>
                            <option>Jammu & Kashmir</option>
                            <option>Ladakh</option>
                            <option>Puducherry</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>
                <div class="co-form-row">
                    <div class="co-form-group">
                        <label>Pincode *</label>
                        <input type="text" id="pincode" placeholder="380001"
                               pattern="[0-9]{6}" maxlength="6" required>
                    </div>
                    <div class="co-form-group">
                        <label>Landmark (optional)</label>
                        <input type="text" id="landmark" placeholder="Near City Hospital">
                    </div>
                </div>

                <button type="submit" class="co-submit-btn" id="continueBtn">
                    Continue to Payment &nbsp;💳
                </button>
            </form>

            <a href="cart.html" class="co-back-link">← Back to Cart</a>
        </div>
    </div>

    <!-- RIGHT: ORDER SUMMARY -->
    <div class="co-summary">
        <div class="co-card">
            <div class="co-summary-title">🧾 Order Summary</div>

            <div class="co-items-list" id="summaryItems">
                <p style="color:var(--muted); font-size:13px;">Loading…</p>
            </div>

            <hr class="co-divider">

            <div class="co-price-row">
                <span>MRP Total</span>
                <span id="mrpTotal">₹0</span>
            </div>
            <div class="co-price-row">
                <span>Delivery</span>
                <span class="green" id="deliveryRow">FREE</span>
            </div>
            <div class="co-price-row total">
                <span>Total</span>
                <span id="grandTotal">₹0</span>
            </div>

            <div class="co-trust">
                <div class="co-badge">🔒 SSL Secure</div>
                <div class="co-badge">🚚 Free Delivery</div>
                <div class="co-badge">✅ Easy Returns</div>
            </div>
        </div>
    </div>

</div>

<!-- MOBILE STICKY BOTTOM -->
<div class="co-mobile-bar">
    <div class="co-mobile-total">
        <span>Total Amount</span>
        <span id="mobileTotal">₹0</span>
    </div>
    <button class="co-mobile-btn" onclick="document.getElementById('continueBtn').click()">
        Continue to Payment 💳
    </button>
</div>

<script>
// ── Pre-fill from localStorage ──────────────────────────────
const storedEmail = localStorage.getItem("email");
if (storedEmail) document.getElementById("emailField").value = storedEmail;

const saved = JSON.parse(localStorage.getItem("customer") || "{}");
if (saved.name)     document.getElementById("customerName").value = saved.name;
if (saved.mobile)   document.getElementById("mobile").value       = saved.mobile;
if (saved.houseNo)  document.getElementById("houseNo").value      = saved.houseNo;
if (saved.address)  document.getElementById("address").value      = saved.address;
if (saved.city)     document.getElementById("city").value         = saved.city;
if (saved.state)    document.getElementById("state").value        = saved.state;
if (saved.pincode)  document.getElementById("pincode").value      = saved.pincode;
if (saved.landmark) document.getElementById("landmark").value     = saved.landmark;

// ── Load order summary ──────────────────────────────────────
function loadSummary() {
    const cart = JSON.parse(localStorage.getItem("cart") || "[]");
    const container = document.getElementById("summaryItems");

    if (cart.length === 0) {
        container.innerHTML = `
            <div class="co-empty">
                <h3>Cart is empty</h3>
                <p>Explore our beautiful resin art collection.</p>
                <a href="products.html">Browse Products</a>
            </div>`;
        return;
    }

    let total = 0;
    let html = "";

    cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        const img = item.image || "images/resin_wall_clock.png";
        html += `
        <div class="co-item">
            <img src="${img}" class="co-item-img" alt="${item.product}" onerror="this.src='images/resin_wall_clock.png'">
            <div class="co-item-info">
                <div class="co-item-name">${item.product}</div>
                <div class="co-item-qty">Qty: ${item.quantity}</div>
            </div>
            <div class="co-item-price">₹${itemTotal.toLocaleString("en-IN")}</div>
        </div>`;
    });

    container.innerHTML = html;
    const delivery = total >= 999 ? 0 : 99;
    const grand = total + delivery;

    document.getElementById("mrpTotal").textContent   = "₹" + total.toLocaleString("en-IN");
    document.getElementById("deliveryRow").textContent = delivery === 0 ? "FREE" : "₹" + delivery;
    document.getElementById("grandTotal").textContent  = "₹" + grand.toLocaleString("en-IN");
    document.getElementById("mobileTotal").textContent = "₹" + grand.toLocaleString("en-IN");
}
loadSummary();

// ── Save address & go to payment ────────────────────────────
function saveAddressAndContinue(e) {
    e.preventDefault();

    const token = localStorage.getItem("token");
    if (!token) {
        alert("Please log in to continue to checkout.");
        window.location.href = "login.html";
        return;
    }

    const customer = {
        name:     document.getElementById("customerName").value.trim(),
        mobile:   document.getElementById("mobile").value.trim(),
        email:    document.getElementById("emailField").value.trim(),
        houseNo:  document.getElementById("houseNo").value.trim(),
        address:  document.getElementById("address").value.trim(),
        city:     document.getElementById("city").value.trim(),
        state:    document.getElementById("state").value,
        pincode:  document.getElementById("pincode").value.trim(),
        landmark: document.getElementById("landmark").value.trim()
    };

    if (!customer.state) {
        alert("Please select your state.");
        return;
    }

    localStorage.setItem("customer", JSON.stringify(customer));
    window.location.href = "payment.html";
}
</script>
</body>
</html>
