<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Niva Aura Resin Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <div class="signup-container">
        <img src="images/logo.png" alt="Niva Aura Logo" class="signup-logo">
        <h1>Niva Aura Studio</h1>
        <p class="subtitle">Create Account</p>

        <div class="name-row">
            <input type="text" id="firstName" placeholder="First Name" required>
            <input type="text" id="lastName" placeholder="Last Name" required>
        </div>

        <input type="email" id="email" placeholder="Email Address" required>

        <input type="password" id="password" placeholder="Create Password" onkeyup="checkPassword()" required>
        <small id="passwordMessage"></small>

        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

        <button class="otp-btn" onclick="sendOTP()">
            Send OTP 📩
        </button>

        <input type="text" id="otp" placeholder="Enter 6-digit OTP">
        <p id="timer" style="color: #E84A5F; font-size: 13px; font-weight: bold; text-align: center; margin: 10px 0; display: none;"></p>

        <button class="signup-btn" id="signupBtn" onclick="verifyOTP()">
            Create Account ✨
        </button>

        <p class="login-text">
            Already have an account? <a href="login.html">Login</a>
        </p>

        <div style="margin-top: 16px;">
            <a href="index.html" style="font-size: 13px; color: var(--text-muted); text-decoration: none;">← Return To Main Website</a>
        </div>
    </div>

    <script src="signup.js"></script>
</body>

</html>
