<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - Niva Aura Resin Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0F171E 0%, #0A3C4A 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-login-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.3);
            text-align: center;
        }

        .admin-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #D4AF37;
            margin-bottom: 16px;
        }

        .admin-title {
            font-size: 26px;
            font-weight: 800;
            color: #0A3C4A;
            margin-bottom: 6px;
        }

        .admin-subtitle {
            font-size: 13px;
            color: #7F8C8D;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .form-group-admin {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group-admin label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #2C3E50;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group-admin input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #E2E8F0;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
            background: #F8FAFC;
        }

        .form-group-admin input:focus {
            border-color: #D4AF37;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
        }

        .btn-admin-submit {
            width: 100%;
            background: linear-gradient(135deg, #0A3C4A 0%, #155B70 100%);
            color: #D4AF37;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(10, 60, 74, 0.3);
            margin-top: 10px;
        }

        .btn-admin-submit:hover {
            background: linear-gradient(135deg, #D4AF37 0%, #B59021 100%);
            color: #111;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        .credentials-hint {
            margin-top: 24px;
            background: #FFFBEB;
            border: 1px solid #FCD34D;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: #92400E;
            line-height: 1.5;
        }

        .credentials-hint strong {
            color: #78350F;
        }

        #statusMsg {
            margin-top: 16px;
            font-size: 13px;
            font-weight: 600;
            min-height: 20px;
        }

        .error-text {
            color: #E84A5F;
        }

        .success-text {
            color: #2E7D32;
        }

        .back-home-link {
            display: inline-block;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-home-link:hover {
            color: #D4AF37;
        }
    </style>
</head>

<body>

    <div class="admin-login-card">
        <img src="images/logo.png" alt="Niva Aura Logo" class="admin-logo">
        <h1 class="admin-title">Admin Studio Portal</h1>
        <p class="admin-subtitle">Management & Control Panel</p>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group-admin">
                <label for="username">Admin Username</label>
                <input type="text" id="username" placeholder="Enter Admin Username" value="vatsal" required autocomplete="username">
            </div>

            <div class="form-group-admin">
                <label for="password">Security Password</label>
                <input type="password" id="password" placeholder="Enter Security Password" value="Vatsal@210" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-admin-submit" id="loginBtn">
                🔐 Login To Admin Dashboard
            </button>
        </form>

        <div id="statusMsg"></div>

        <div class="credentials-hint">
            💡 <strong>Default Admin Credentials:</strong><br>
            Username: <code>vatsal</code> | Password: <code>Vatsal@210</code><br>
            <span style="font-size: 11px; opacity: 0.85;">(Also accepts: <code>admin</code> / <code>admin123</code>)</span>
        </div>
    </div>

    <a href="index.html" class="back-home-link">← Return To Main Website</a>

    <script>
        async function handleAdminLogin(event) {
            event.preventDefault();

            const usernameInput = document.getElementById("username").value.trim();
            const passwordInput = document.getElementById("password").value.trim();
            const statusMsg = document.getElementById("statusMsg");
            const loginBtn = document.getElementById("loginBtn");

            if (!usernameInput || !passwordInput) {
                statusMsg.className = "error-text";
                statusMsg.innerText = "Please enter both username and password.";
                return;
            }

            statusMsg.className = "";
            statusMsg.innerText = "Authenticating admin credentials...";
            loginBtn.disabled = true;

            // Known admin credentials matchers
            const isValidCredential = (usernameInput === "vatsal" && passwordInput === "Vatsal@210") ||
                                      (usernameInput === "admin" && passwordInput === "admin123");

            try {
                // Attempt server authentication first
                const response = await fetch("http://localhost:5000/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem("adminToken", data.token);
                    localStorage.setItem("adminLoggedIn", "true");
                    localStorage.setItem("adminUser", usernameInput);

                    statusMsg.className = "success-text";
                    statusMsg.innerText = "✅ Login Successful! Redirecting...";
                    setTimeout(() => {
                        window.location.href = "admin.html";
                    }, 600);
                    return;
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    if (isValidCredential) {
                        // Fallback login if backend returns non-ok for valid credentials
                        grantLocalAdminSession(usernameInput);
                        return;
                    }
                    statusMsg.className = "error-text";
                    statusMsg.innerText = errorData.message || "Invalid Username or Password. Please try vatsal / Vatsal@210";
                    loginBtn.disabled = false;
                    return;
                }
            } catch (networkError) {
                console.warn("Backend API unavailable. Attempting offline fallback check.");
                
                if (isValidCredential) {
                    grantLocalAdminSession(usernameInput);
                } else {
                    statusMsg.className = "error-text";
                    statusMsg.innerText = "Invalid Admin Credentials. (Hint: vatsal / Vatsal@210)";
                    loginBtn.disabled = false;
                }
            }
        }

        function grantLocalAdminSession(username) {
            const statusMsg = document.getElementById("statusMsg");
            // Generate a demo JWT-like token for offline mode
            const mockToken = "mock_admin_token_" + Date.now();
            localStorage.setItem("adminToken", mockToken);
            localStorage.setItem("adminLoggedIn", "true");
            localStorage.setItem("adminUser", username);

            statusMsg.className = "success-text";
            statusMsg.innerText = "✅ Admin Authenticated! Opening Dashboard...";
            setTimeout(() => {
                window.location.href = "admin.html";
            }, 600);
        }
    </script>
</body>

</html>
